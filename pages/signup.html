<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | BookNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="signup">
    <div id="header-root"></div>

    <div class="page-shell auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <span class="eyebrow">Create account</span>
          <h1>Sign up</h1>
        </div>

        <form id="signup-form" class="auth-form">
          <label>
            <span>Full name</span>
            <input name="name" type="text" placeholder="Your full name" required />
          </label>

          <label>
            <span>Email</span>
            <input name="email" type="email" placeholder="you@example.com" required />
          </label>

          <label>
            <span>Valid ID number</span>
            <input name="idNumber" type="text" placeholder="Enter a valid ID number" required />
          </label>

          <label>
            <span>Password</span>
            <input name="password" type="password" placeholder="Create a password" required />
          </label>

          <button type="submit" class="primary-btn">Create account</button>
        </form>

        <p class="auth-switch">
          Already registered?
          <a href="login.html">Log in</a>
        </p>

        <div id="signup-message" class="auth-message" aria-live="polite"></div>
      </div>
    </div>

    <script src="../src/components/site-header.js"></script>
    <script src="../src/js/auth.js"></script>
  </body>
</html>
